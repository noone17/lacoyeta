<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Lacoyeta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <main class="login-page">

    <!-- ── LEFT · PHOTO ──────────────────────────────────────────────── -->
    <section class="login-photo-side">
      <div class="login-frame">
        <div class="login-frame-inner">
          <img src="login-pic.jpeg" alt="" />
        </div>
        <span class="login-frame-caption">five feet of quiet magic.</span>
      </div>
    </section>

    <!-- ── RIGHT · PIN ───────────────────────────────────────────────── -->
    <section class="login-form-side">
      <div class="login-card">
        <p class="login-kicker">For Lacoyeta</p>
        <h1 class="login-title">Enter to continue.</h1>
        <p class="login-sub">You know the date.</p>

        <!-- dot display -->
        <div class="dial-dots" id="dialDots">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <p class="login-error" id="loginError">That's not quite it. Try again.</p>

        <!-- dial pad -->
        <div class="dial-pad">
          <button class="dial-key" data-n="1"><span class="dk-num">1</span><span class="dk-sub"> </span></button>
          <button class="dial-key" data-n="2"><span class="dk-num">2</span><span class="dk-sub">ABC</span></button>
          <button class="dial-key" data-n="3"><span class="dk-num">3</span><span class="dk-sub">DEF</span></button>
          <button class="dial-key" data-n="4"><span class="dk-num">4</span><span class="dk-sub">GHI</span></button>
          <button class="dial-key" data-n="5"><span class="dk-num">5</span><span class="dk-sub">JKL</span></button>
          <button class="dial-key" data-n="6"><span class="dk-num">6</span><span class="dk-sub">MNO</span></button>
          <button class="dial-key" data-n="7"><span class="dk-num">7</span><span class="dk-sub">PQRS</span></button>
          <button class="dial-key" data-n="8"><span class="dk-num">8</span><span class="dk-sub">TUV</span></button>
          <button class="dial-key" data-n="9"><span class="dk-num">9</span><span class="dk-sub">WXYZ</span></button>
          <span class="dial-empty"></span>
          <button class="dial-key" data-n="0"><span class="dk-num">0</span><span class="dk-sub">+</span></button>
          <button class="dial-key dial-key--del" id="dialDel">⌫</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    const PIN   = '09072007';
    const error = document.getElementById('loginError');
    const card  = document.querySelector('.login-card');
    const dots  = document.querySelectorAll('#dialDots span');
    let entered = '';

    if (sessionStorage.getItem('lacoyetaUnlocked') === 'true') {
      location.replace('index.html');
    }

    function updateDots() {
      dots.forEach((d, i) => d.classList.toggle('filled', i < entered.length));
    }

    function shake() {
      card.classList.remove('shake');
      requestAnimationFrame(() => card.classList.add('shake'));
    }

    function tryUnlock() {
      if (!entered.length) return;
      if (entered === PIN) {
        sessionStorage.setItem('lacoyetaUnlocked', 'true');
        location.href = 'index.html';
      } else {
        error.classList.add('visible');
        shake();
        entered = '';
        updateDots();
      }
    }

    document.querySelectorAll('.dial-key[data-n]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (entered.length >= 8) return;
        error.classList.remove('visible');
        entered += btn.dataset.n;
        updateDots();
        if (entered.length === 8) tryUnlock();
      });
    });

    document.getElementById('dialDel').addEventListener('click', () => {
      entered = entered.slice(0, -1);
      error.classList.remove('visible');
      updateDots();
    });

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9' && entered.length < 8) {
        error.classList.remove('visible');
        entered += e.key;
        updateDots();
        if (entered.length === 8) tryUnlock();
      } else if (e.key === 'Backspace') {
        entered = entered.slice(0, -1);
        error.classList.remove('visible');
        updateDots();
      } else if (e.key === 'Enter') {
        tryUnlock();
      }
    });
  </script>
</body>
</html>
